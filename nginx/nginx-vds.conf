limit_req_zone $binary_remote_addr zone=yesihave_writes:10m rate=30r/m;

# This listener is private; the public Caddy proxy supplies the HTTPS scheme.
map $http_x_forwarded_proto $yesihave_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 21M;
  limit_req_status 429;

  auth_basic "YesIHave";
  auth_basic_user_file /etc/nginx/htpasswd;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  if ($http_sec_fetch_site = cross-site) {
    return 403;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $yesihave_forwarded_proto;

  location ~ ^/(api|web)/(check|add|feedback) {
    limit_req zone=yesihave_writes burst=10 nodelay;
    proxy_pass http://app:8080;
  }

  location / {
    proxy_pass http://app:8080;
  }
}
