spring:
  application:
    name: yesihave
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yesihave}
    username: ${DB_USER:yesihave}
    password: ${DB_PASSWORD:yesihave}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  image:
    max-file-bytes: ${APP_IMAGE_MAX_FILE_BYTES:10485760}
    max-pixels: ${APP_IMAGE_MAX_PIXELS:13000000}
    max-dimension: ${APP_IMAGE_MAX_DIMENSION:6000}
    max-concurrent-requests: ${APP_IMAGE_MAX_CONCURRENT_REQUESTS:2}
  embedding:
    provider: ${APP_EMBEDDING_PROVIDER:onnx}
    onnx-model-path: ${APP_ONNX_MODEL_PATH:}
    onnx-input-name: ${APP_ONNX_INPUT_NAME:}
    onnx-output-name: ${APP_ONNX_OUTPUT_NAME:}
    dimension: ${APP_EMBEDDING_DIMENSION:512}
    model-version: ${APP_EMBEDDING_MODEL_VERSION:clip-vitb32-openai-preprocess-v2}
    require-active-version: ${APP_EMBEDDING_REQUIRE_ACTIVE_VERSION:true}
  matching:
    match-pair-threshold: ${APP_MATCH_PAIR_THRESHOLD:0.90}
    match-min-side-threshold: ${APP_MATCH_MIN_SIDE_THRESHOLD:0.86}
    uncertain-pair-threshold: ${APP_UNCERTAIN_PAIR_THRESHOLD:0.84}
    top-k-side: ${APP_MATCH_TOP_K_SIDE:20}
    top-k-response: ${APP_MATCH_TOP_K_RESPONSE:3}
  telegram:
    token: ${APP_TELEGRAM_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    session-ttl: ${APP_TELEGRAM_SESSION_TTL:15m}
    session-cleanup-interval: ${APP_TELEGRAM_SESSION_CLEANUP_INTERVAL:1m}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:coasters}
  storage-reconciliation:
    enabled: ${APP_STORAGE_RECONCILIATION_ENABLED:true}
    delete-orphans: ${APP_STORAGE_DELETE_ORPHANS:true}
    orphan-grace-period: ${APP_STORAGE_ORPHAN_GRACE_PERIOD:24h}
    reference-batch-size: ${APP_STORAGE_REFERENCE_BATCH_SIZE:500}
    initial-delay: ${APP_STORAGE_RECONCILIATION_INITIAL_DELAY:5m}
    interval: ${APP_STORAGE_RECONCILIATION_INTERVAL:24h}
