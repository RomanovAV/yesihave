services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yesihave-postgres
    environment:
      POSTGRES_DB: yesihave
      POSTGRES_USER: yesihave
      POSTGRES_PASSWORD: yesihave
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yesihave -d yesihave"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: yesihave-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-02-15T10-36-16Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/coasters
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yesihave-app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/yesihave
      DB_USER: yesihave
      DB_PASSWORD: yesihave
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: coasters
      APP_TELEGRAM_TOKEN: ${APP_TELEGRAM_TOKEN:-}
      APP_TELEGRAM_SESSION_TTL: ${APP_TELEGRAM_SESSION_TTL:-15m}
      APP_TELEGRAM_ALLOWED_USER_IDS: ${APP_TELEGRAM_ALLOWED_USER_IDS:-}
      APP_TELEGRAM_SESSION_CLEANUP_INTERVAL: ${APP_TELEGRAM_SESSION_CLEANUP_INTERVAL:-1m}
      APP_IMAGE_MAX_FILE_BYTES: ${APP_IMAGE_MAX_FILE_BYTES:-10485760}
      APP_IMAGE_MAX_PIXELS: ${APP_IMAGE_MAX_PIXELS:-13000000}
      APP_IMAGE_MAX_DIMENSION: ${APP_IMAGE_MAX_DIMENSION:-6000}
      APP_IMAGE_MAX_CONCURRENT_REQUESTS: ${APP_IMAGE_MAX_CONCURRENT_REQUESTS:-2}
      APP_STORAGE_RECONCILIATION_ENABLED: ${APP_STORAGE_RECONCILIATION_ENABLED:-true}
      APP_STORAGE_DELETE_ORPHANS: ${APP_STORAGE_DELETE_ORPHANS:-true}
      APP_STORAGE_ORPHAN_GRACE_PERIOD: ${APP_STORAGE_ORPHAN_GRACE_PERIOD:-24h}
      APP_STORAGE_REFERENCE_BATCH_SIZE: ${APP_STORAGE_REFERENCE_BATCH_SIZE:-500}
      APP_STORAGE_RECONCILIATION_INITIAL_DELAY: ${APP_STORAGE_RECONCILIATION_INITIAL_DELAY:-5m}
      APP_STORAGE_RECONCILIATION_INTERVAL: ${APP_STORAGE_RECONCILIATION_INTERVAL:-24h}
      APP_EMBEDDING_PROVIDER: ${APP_EMBEDDING_PROVIDER:-onnx}
      APP_EMBEDDING_DIMENSION: ${APP_EMBEDDING_DIMENSION:-512}
      APP_ONNX_MODEL_PATH: ${APP_ONNX_MODEL_PATH:-/app/models/clip-vitb32.onnx}
      APP_ONNX_INPUT_NAME: ${APP_ONNX_INPUT_NAME:-}
      APP_ONNX_OUTPUT_NAME: ${APP_ONNX_OUTPUT_NAME:-}
      APP_EMBEDDING_MODEL_VERSION: ${APP_EMBEDDING_MODEL_VERSION:-clip-vitb32-openai-preprocess-v2}
      APP_EMBEDDING_REQUIRE_ACTIVE_VERSION: "true"
    volumes:
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    security_opt:
      - no-new-privileges:true

  reindex:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: yesihave-reindex
    profiles: ["tools"]
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/yesihave
      DB_USER: yesihave
      DB_PASSWORD: yesihave
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: coasters
      APP_TELEGRAM_TOKEN: ${APP_TELEGRAM_TOKEN:-}
      APP_IMAGE_MAX_FILE_BYTES: ${APP_IMAGE_MAX_FILE_BYTES:-10485760}
      APP_IMAGE_MAX_PIXELS: ${APP_IMAGE_MAX_PIXELS:-13000000}
      APP_IMAGE_MAX_DIMENSION: ${APP_IMAGE_MAX_DIMENSION:-6000}
      APP_IMAGE_MAX_CONCURRENT_REQUESTS: ${APP_IMAGE_MAX_CONCURRENT_REQUESTS:-2}
      APP_STORAGE_RECONCILIATION_ENABLED: "false"
      APP_EMBEDDING_PROVIDER: ${APP_REINDEX_EMBEDDING_PROVIDER:-onnx}
      APP_EMBEDDING_DIMENSION: ${APP_REINDEX_EMBEDDING_DIMENSION:-512}
      APP_ONNX_MODEL_PATH: ${APP_REINDEX_ONNX_MODEL_PATH:-/workspace/models/clip-vitb32.onnx}
      APP_ONNX_INPUT_NAME: ${APP_REINDEX_ONNX_INPUT_NAME:-}
      APP_ONNX_OUTPUT_NAME: ${APP_REINDEX_ONNX_OUTPUT_NAME:-}
      APP_EMBEDDING_MODEL_VERSION: ${APP_REINDEX_EMBEDDING_MODEL_VERSION:-clip-vitb32-openai-preprocess-v2}
      APP_EMBEDDING_REQUIRE_ACTIVE_VERSION: "false"
    volumes:
      - ./:/workspace
    command: ./scripts/reindex-embeddings.sh

  nginx:
    image: nginx:1.27-alpine
    container_name: yesihave-nginx
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro

  nginx-tls:
    image: nginx:1.27-alpine
    container_name: yesihave-nginx-tls
    profiles: ["public"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ${TLS_CERT_DIR:-./nginx/tls}:/etc/nginx/tls:ro

volumes:
  pg_data:
  minio_data:
