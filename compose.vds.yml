name: yesihave

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: yesihave
      POSTGRES_USER: yesihave
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.vds}
    volumes:
      - pg_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=32MB -c max_connections=30
    mem_limit: 256m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yesihave -d yesihave"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: yesihave-storage:7aac2a2-77f82e1
    build:
      context: .
      dockerfile: Dockerfile.storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.vds}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.vds}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    mem_limit: 256m
    memswap_limit: 512m

  minio-init:
    image: yesihave-storage:7aac2a2-77f82e1
    pull_policy: never
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.vds}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.vds}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 60 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing local/coasters

  app:
    build:
      context: .
      dockerfile: Dockerfile.vds
    image: yesihave:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/yesihave
      DB_USER: yesihave
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.vds}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.vds}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.vds}
      MINIO_BUCKET: coasters
      APP_EMBEDDING_PROVIDER: onnx
      APP_EMBEDDING_DIMENSION: "512"
      APP_ONNX_MODEL_PATH: /app/models/clip-vitb32.onnx
      APP_ONNX_INPUT_NAME: image
      APP_ONNX_OUTPUT_NAME: embedding
      APP_EMBEDDING_MODEL_VERSION: clip-vitb32-openai-preprocess-v2
      APP_EMBEDDING_REQUIRE_ACTIVE_VERSION: "true"
      APP_IMAGE_MAX_CONCURRENT_REQUESTS: "1"
      APP_TELEGRAM_TOKEN: ${APP_TELEGRAM_TOKEN:-}
      APP_TELEGRAM_ALLOWED_USER_IDS: ${APP_TELEGRAM_ALLOWED_USER_IDS:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx384m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=1}
    volumes:
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${APP_MEMORY_LIMIT:-1280m}
    memswap_limit: ${APP_MEMORY_SWAP_LIMIT:-2g}
    cpus: ${APP_CPUS:-0.75}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 6s
      start_period: 90s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${YESIHAVE_PORT:-8082}:8080"
    volumes:
      - ./nginx/nginx-vds.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro

volumes:
  pg_data:
  minio_data:
